# cargo-deny configuration. Read the job log: an advisory acknowledgement is the PM's call at gate.
[graph]
all-features = true

[advisories]
version = 2
# PM ruling 2026-11-24 (consent#21): chrono is unmaintained (RUSTSEC-2026-0543)
# and every project here uses it. Ignored with an EXPIRY: this entry must be
# removed, with chrono left for jiff or time, by 2026-12-17 (ROADMAP row).
# chrono-tz (RUSTSEC-2026-0555) is NOT ignored: it is no longer a dependency.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no safe upgrade; leave chrono by 2026-12-17" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
