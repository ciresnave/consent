[package]
name = "user-request"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Ask a person to approve something, through an interchangeable channel (Windows Hello first), with an approver-chosen grant. See crates/user-request/README.md."

[dependencies]
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
getrandom = "0.4.3"
hmac = "0.13.0"
lane-state.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# `fido2` feature: the security-key presence provider (S3). Linux needs
# pkg-config and libudev-dev to build it (hidapi, hidraw backend).
ctap-hid-fido2 = { version = "3.6.0", optional = true }

# Windows-only: Windows Hello. Every use is cfg(windows); windows-future does
# not compile on other targets, and CI also builds on Ubuntu.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_System_Memory"] }
windows-future = "0.3.2"

[features]
fido2 = ["dep:ctap-hid-fido2"]
# `Approval::for_test`: a hand-made approval, for tests that drive the store
# without a person. Never enable it in a shipped binary.
test-support = []

[dev-dependencies]
user-request = { path = ".", features = ["test-support"] }
# signs test assertions like a key would (fido2 feature tests)
ring = "0.17.14"
tempfile = "3.27.0"
# real time zones, for the DST-gap tests (review of #1)
chrono-tz = "0.10.4"
