[package]
name = "with-secret"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runs one command with one secret, after its owner approves via Windows Hello. Stops accidental exposure, not deliberate misuse - see WITH-SECRET-DESIGN.md section 3."

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
getrandom = "0.4.3"
hmac = "0.13.0"
lane-restart = { path = "../lane-restart" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

# Windows-only: DPAPI, Windows Hello and the console. Every use is cfg(windows);
# windows-future does not compile on other targets, and CI also builds on Ubuntu.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_System_Memory"] }
windows-future = "0.3.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3.27.0"
